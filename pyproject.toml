[project]
name = "synapse-showcase"
version = "0.1.0"
description = "Learn MCP apps through a shared guide and practice board"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.13"
authors = [
    { name = "NimbleBrain Inc", email = "hello@nimblebrain.ai" },
]
keywords = ["mcp", "synapse", "guide", "onboarding", "nimblebrain"]
dependencies = [
    # Bundle installation uses these constraints rather than uv.lock.
    # Keep the intended FastMCP/MCP compatibility pair explicit.
    "fastmcp==3.4.10",
    # skills.py relies on MCP 1.x session internals; review both pins together.
    "mcp==1.30.0",
    "jsonschema>=4.26.0",
    "starlette>=1.3.1",
    "uvicorn>=0.42.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synapse_showcase"]
only-include = ["src/synapse_showcase", "skills"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
"skills" = "synapse_showcase/assets/skills"

[dependency-groups]
dev = [
    "ruff>=0.13.1",
    "ty>=0.0.1a1",
    "pytest>=8.4.2",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
